schema: spec-driven

context: |
  Project: meinteresa
  Stack: TanStack Start, React 19, TypeScript 6, Vite 8, Tailwind CSS v4
  Architecture: feature-oriented TanStack Start app with localized item, auth, and dashboard flows; PocketBase-backed persistence alongside mock/local UI slices
  Testing: Vitest + Testing Library with jsdom; route and component behavior tests are present
  Style: strict TypeScript, named React function components, Tailwind v4 tokens, shadcn-compatible UI primitives
  Persistence: hybrid (OpenSpec + Engram)

strict_tdd: false

testing:
  detected: "2026-07-02"
  runner:
    command: "npx pnpm test"
    framework: vitest
  layers:
    unit:
      available: true
      tool: vitest
    integration:
      available: true
      tool: "vitest + @testing-library/react"
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality_tools:
    linter:
      available: false
      command: null
    type_checker:
      available: true
      command: "npx pnpm typecheck"
    formatter:
      available: false
      command: null

rules:
  proposal:
    - Include rollback notes for risky changes.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords where behavior matters.
  design:
    - Document rationale for architecture decisions.
  tasks:
    - Keep tasks small and session-sized.
  apply:
    - Follow existing code patterns.
    - Strict TDD remains disabled by explicit project config, even though Vitest is available.
  verify:
    - Run `npx pnpm test`, `npx pnpm typecheck`, and `npx pnpm build` before review-ready handoff.
  archive:
    - Warn before merging destructive deltas.
